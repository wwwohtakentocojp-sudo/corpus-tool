# =============================================================================
# config.yaml — ツール全体の設定
#
# ★ ここにある閾値は、コーパス言語学の分野で広く使われている「目安」であって、
#   絶対的な基準ではありません。研究分野・データの性質によって適切な値は異なります。
#   値を変えたときは、論文の方法の節に必ずその値を明記してください。
#   （閾値を書かない結果は、他の研究者が再現できません）
# =============================================================================

# -----------------------------------------------------------------------------
# 第2層（判定ルール）の閾値
# -----------------------------------------------------------------------------
thresholds:
  # 総語数がこの値未満なら「データが小さすぎる」警告を出す
  corpus_min_tokens: 10000

  # 分散度DP がこの値を「超えた」語に「一部の文書に偏っている」警告を出す
  # 0に近いほど均等、1に近いほど偏り。Gries (2008) 以降 0.5 が慣用的な目安
  dp_skew: 0.5

  # 分散度の警告を出す最低出現回数。
  # 低頻度語は構造的にDPが高くなるため、これ未満の語には警告を出さない
  dp_min_freq: 10

  # 分散度の判定に必要な最低分割数（文書数またはグループ数）。
  # これ未満だと DP の値そのものが信頼できないため、語ごとの偏り警告は出さず、
  # 「文書数が少ないため判定は信頼できない」という注意を1つだけ表示する
  dp_min_parts: 10

  # 出現回数がこの値未満の語について「主張は避けるべき」と注意する
  low_freq: 5

  # --- 以下は Phase 2 以降で使用 ---
  # 2群の文書数比がこの値を超えたら「群の偏り」警告
  group_imbalance_ratio: 3.0
  # MIスコアがこの値を超え、かつ共起頻度が mi_min_cooccur 未満なら「低頻度に注意」
  mi_high: 5.0
  mi_min_cooccur: 20
  # Tスコアがこの値を超え、かつMIがこの値未満なら「高頻度語による見かけの共起」
  t_high: 2.0
  mi_low: 3.0
  # log ratio の絶対値がこの値未満なら「差が小さすぎる」
  log_ratio_min: 1.0

# -----------------------------------------------------------------------------
# コロケーション / 特徴語 / 共起ネットワーク
# -----------------------------------------------------------------------------
collocation:
  default_window: 5        # 固定ウィンドウの前後語数
  min_cooccur: 2           # 表に載せる最低共起回数
  max_rows: 300            # 画面に表示する最大行数

keyness:
  # 「差があるか」の足切り。G² がこの値未満の語は表から外す（6.63 = p<0.01 相当）
  min_g2: 6.63
  # 両群合計の出現回数がこれ未満の語は外す
  min_total_freq: 5

network:
  top_n: 60                # 節点にする語数（頻度上位）
  min_log_dice: 7.0        # 線を引く logDice の下限
  min_cooccur: 2           # 線を引く最低共起回数

# -----------------------------------------------------------------------------
# 基本統計
# -----------------------------------------------------------------------------
basic_stats:
  # 標準化TTR の区切り幅（語数）。論文には必ずこの値を明記すること
  sttr_window: 1000

# -----------------------------------------------------------------------------
# KWIC
# -----------------------------------------------------------------------------
kwic:
  default_window: 5      # 前後に表示する語数
  max_rows_display: 5000 # 画面に一度に表示する最大行数（CSVには全件出力される）

# -----------------------------------------------------------------------------
# 解説文の生成（第3層）— Phase 2 で使用
# -----------------------------------------------------------------------------
narrator:
  # 使用するモデル。変更可。
  model: "claude-sonnet-5"
  max_tokens: 4000

# -----------------------------------------------------------------------------
# 言語ごとの既定値
# -----------------------------------------------------------------------------
languages:
  ja:
    # 「機能語」として既定で除外する品詞（UniDic の品詞大分類）
    function_pos:
      - 助詞
      - 助動詞
      - 補助記号
      - 記号
      - 空白
    # 見出し語の粒度: "lemma"（語彙素。表記ゆれも統合）/ "orth_base"（書字形基本形。表記を保つ）
    lemma_unit: "lemma"
    # Unicode 正規化（全角英数→半角など）
    nfkc: true

  en:
    model: "sm"            # "sm"（同梱）/ "lg"（uv sync --extra large-models）
    lowercase: true
    function_pos: [DET, ADP, PRON, AUX, CCONJ, SCONJ, PART, PUNCT, SYM, SPACE]

  de:
    model: "sm"
    lowercase: false       # ★ Essen（名詞）と essen（動詞）を統合しないため OFF
    lemma_mode: "spacy"    # "spacy" / "hanta" / "both"
    separable_verbs: true  # rufe … an → anrufen
    compound_split: false  # ★ 造語性が研究対象になり得るため既定 OFF
    compound_min_score: 0.5      # 分割候補の信頼度がこれ未満なら分けない
    compound_min_part_len: 3     # 構成要素がこれより短ければ分けない
    norm_1996: false       # ★ 通時研究の妨げになるため既定 OFF（混在検出時に提案する）
    norm_ss: false
    norm_umlaut: false
    function_pos: [DET, ADP, PRON, AUX, CCONJ, SCONJ, PART, PUNCT, SYM, SPACE]
