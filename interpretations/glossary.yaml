# =============================================================================
# glossary.yaml — 用語辞書（第1層）
#
# このファイルはツールが表示する固定解説テキストです。
# AIは一切関与しません。ここに書かれた文言が、そのまま利用者に表示されます。
#
# 各指標は以下の構造を持ちます:
#   label    : UIに表示する名前（やさしい言い換え + 専門用語）
#   what     : 何を測っているか（統計用語を使わずに）
#   high     : 値が高いとどういう意味か
#   low      : 値が低いとどういう意味か（該当する指標のみ）
#   caution  : この指標の弱点・誤用されやすい点（最重要）
#   range    : 取りうる値の範囲と目安
#   example  : 具体例（任意）
#
# 編集方針:
#   - caution は必ず書くこと。空欄にしない。
#   - 「〜かもしれません」ではなく「〜です」「〜してください」と言い切る。
#     統計を知らない利用者にとって、曖昧な警告は警告として機能しない。
#   - 数値の目安は分野の慣習であり絶対的な基準ではない。
#     閾値そのものは config.yaml で変更可能。
# =============================================================================

# -----------------------------------------------------------------------------
# 頻度に関する指標
# -----------------------------------------------------------------------------

frequency:
  label: "出現回数（頻度）"
  what: |
    その語がデータの中に何回出てきたかを、そのまま数えた数字です。
  high: |
    そのデータの中でよく使われている語です。
  low: |
    あまり使われていない語です。ただし、たまたま今回のデータに
    入らなかっただけの可能性もあります。
  caution: |
    ★ 大きさの違うデータ同士を、この数字で比べることはできません。

    10万語のデータで50回出た語と、1万語のデータで20回出た語では、
    生の数字は前者が多いですが、割合では後者のほうが多く使われています。
    データの大きさが違うものを比較するときは、必ず pmw を使ってください。

    また、出現回数が5回未満の語について何かを主張するのは避けてください。
    偶然そこにあっただけの可能性が高く、データをもう一度集め直したら
    消えてしまう程度の数字です。
  range: |
    0以上の整数。上限なし。

pmw:
  label: "100万語あたりの出現回数（pmw）"
  what: |
    「もしこのデータが100万語だったら、その語は何回出てくるか」に
    換算した数字です。データの大きさの違いをならすための数字です。
  high: |
    そのデータの中で、比率として多く使われている語です。
  low: |
    比率として少ない語です。
  caution: |
    データの大きさが違うもの同士を比べられるのがこの数字の利点ですが、
    元の出現回数が少ないと、換算した結果が実態より大きく見えます。

    例えば、5千語のデータで2回しか出ていない語でも、
    100万語に換算すると「400回」という大きな数字になります。
    ★ pmw が大きくても、元の出現回数が一桁なら、その数字は信用しないでください。

    表示では必ず元の出現回数も一緒に確認する習慣をつけてください。
  range: |
    0以上。100万語あたりの回数。
  example: |
    10万語のデータで50回出た語 → pmw = 500

dispersion_dp:
  label: "散らばり具合（分散度DP）"
  what: |
    その語が、データ全体にまんべんなく出ているのか、
    それとも一部の文書に集中しているのかを表す数字です。
  high: |
    ★ 一部の文書に偏っています。
    特定の書き手や特定の記事だけが繰り返し使っているだけ、という状態です。
  low: |
    データ全体にまんべんなく出ています。
    「このデータ全体に共通する特徴」と言える語です。
  caution: |
    ★ 出現回数が多いのに散らばり具合が悪い語を、
      「よく使われる語」と呼んではいけません。

    たとえば400回出ている語でも、そのうち350回が1つの記事の中にあるなら、
    それは「よく使われる語」ではなく「ある記事の特徴」です。
    論文でうっかり前者のように書いてしまうと、大きな誤りになります。

    この数字が 0.5 を超えた語については、必ずその語が
    どの文書に出ているかを確認してから扱ってください。
  range: |
    0.0 〜 1.0。
    0に近い = 全体に均等。1に近い = 極端に偏っている。
    目安として 0.5 を超えたら偏りを疑う。
  example: |
    DP = 0.78 → 「頻度は高いが、ごく一部の文書に集中している」

ttr:
  label: "語彙の豊かさ（TTR）"
  what: |
    使われた語のうち、何割が「違う種類の語」だったかの割合です。
    同じ語を繰り返さず、いろいろな語を使っているほど高くなります。
  high: |
    多様な語が使われています。
  low: |
    同じ語が繰り返し使われています。
  caution: |
    ★ この数字で、長さの違う文章を比べてはいけません。絶対にです。

    TTRには「文章が長くなるほど自動的に下がる」という性質があります。
    長い文章ほど「が」「の」「する」のような語が何度も出るので、
    種類の割合が下がるのは当たり前だからです。

    そのため、長い文章と短い文章を比べると、
    「長いほうが語彙が貧しい」という、内容とは無関係な偽の結果が出ます。
    これは非常によくある誤りです。

    比較したいときは、必ず「標準化TTR」を使ってください。
  range: |
    0.0 〜 1.0。

ttr_standardized:
  label: "語彙の豊かさ・比較用（標準化TTR）"
  what: |
    文章を1000語ずつに区切って、それぞれのTTRを計算し、平均した数字です。
    区切る長さを揃えることで、文章の長さによる影響を取り除いています。
  high: |
    多様な語が使われています。
  low: |
    同じ語が繰り返し使われています。
  caution: |
    長さの違う文章同士を比べるときは、TTRではなくこちらを使ってください。

    ただし、区切る長さ（既定では1000語）を変えると数値も変わります。
    論文に書くときは、必ず「1000語単位で算出」のように
    区切り幅を明記してください。書かないと、他の研究と比較できません。

    また、全体が1000語に満たない文書はこの計算ができません。
    その場合は結果に含まれず、その旨が表示されます。
  range: |
    0.0 〜 1.0。

# -----------------------------------------------------------------------------
# 共起（コロケーション）に関する指標
# -----------------------------------------------------------------------------

cooccurrence_frequency:
  label: "一緒に出た回数（共起頻度）"
  what: |
    調べたい語のすぐ近く（既定では前後5語以内）に、
    その語が何回あらわれたかを数えた数字です。
  high: |
    実際によく一緒に出てきている組み合わせです。
  low: |
    あまり一緒には出ていません。
  caution: |
    この数字だけで「結びつきが強い」と判断してはいけません。

    もともとよく使われる語は、何の語の隣にも自然と多く出てきます。
    日本語なら「の」「する」、ドイツ語なら "die" "und" のような語です。
    これらは共起頻度が必ず上位に来ますが、
    それは結びつきが強いからではなく、単にどこにでもあるからです。

    結びつきの強さを見るには、下のMIスコアやlogDiceと
    合わせて判断してください。
  range: |
    0以上の整数。

mi_score:
  label: "結びつきの強さ・珍しさ重視（MIスコア）"
  what: |
    2つの語が「たまたま近くに並ぶ場合」と比べて、
    実際には何倍多く一緒に出ているかを表す数字です。
  high: |
    ★ 珍しいけれど、出るときは強く結びついている組み合わせです。
    決まった言い回しや、専門用語の組み合わせを見つけるのに向いています。
  low: |
    偶然並んでいるのと大差ありません。
  caution: |
    ★ この数字は、出現回数が少ない語を過大評価します。

    もともと3回しか出ていない語が、その3回とも同じ語の隣にあれば、
    MIスコアは非常に高くなります。しかし3回では、
    それが本当の傾向なのか偶然なのかを判断できません。

    目安として、一緒に出た回数が20回未満の組み合わせについては、
    MIスコアが高くても、必ず用例を全て自分の目で確認してください。
    確認せずに論文に書くのは危険です。

    逆に、よく使われる語同士の組み合わせではMIは低く出ます。
    MIが低い = 重要ではない、ではありません。
  range: |
    理論上は制限なし。実務上は 0 前後が「偶然と同じ」、
    3以上で結びつきあり、5以上で強い、とされることが多い。
  example: |
    MI = 9.8、共起回数12回 → 「強く結びついているが、
    回数が少ないので用例の確認が必須」

t_score:
  label: "結びつきの安定性（Tスコア）"
  what: |
    その組み合わせが「たまたまそうなった」で説明しきれない度合いを
    表す数字です。何度も繰り返し一緒に出ているほど高くなります。
  high: |
    安定して、繰り返し一緒に出ている組み合わせです。
  low: |
    一緒に出ることが少ないか、偶然の範囲です。
  caution: |
    ★ この数字は、よく使われる語を過大評価します。

    Tスコアの上位に、日本語なら「の」「が」「する」、
    ドイツ語なら "die" "der" "und"、英語なら "the" "of" のような語が
    並ぶことがよくあります。これは発見ではありません。
    単にその語がどこにでも出るというだけです。

    機能語（助詞・冠詞・前置詞など）が上位に来たときは、
    分析設定で機能語を除外するか、
    その行は読み飛ばしてください。
  range: |
    絶対値が2以上であれば意味のある組み合わせとされることが多い。
  example: |
    Tスコア = 12.1（冠詞 "die"）→ 「これはノイズです。発見ではありません」

log_dice:
  label: "結びつきの強さ・総合（logDice）"
  what: |
    MIスコアとTスコアの弱点をおぎなうように作られた指標です。
    珍しさと安定性の両方を、バランスよく反映します。
  high: |
    総合的に見て、結びつきが強い組み合わせです。
  low: |
    結びつきは弱いです。
  caution: |
    ★ どれを見ればいいか迷ったら、まずこれを見てください。

    この数字の大きな利点は、データの大きさに影響されにくいことです。
    そのため、大きさの違うデータ同士の結果を比較できます。
    MIスコアやTスコアではこの比較ができません。

    ★ ただし、両方とも非常によく使われる語どうしの組み合わせでは、
      logDice も高く出ます。これは「どちらもよく出る語だから、
      自然と一緒にも出る」というだけで、特別な結びつきではありません。
      中心語と共起語の両方の出現回数を確認し、
      どちらも際立って多い場合は、その組み合わせを発見として扱わないでください。

    また、万能ではありません。
    最終的には必ずKWIC画面で実際の用例を確認してください。
    どの指標も、用例を見ることの代わりにはなりません。
  range: |
    おおむね 0 〜 14。7以上で結びつきが強いとされることが多い。

log_likelihood:
  label: "偶然では説明しにくい度合い（対数尤度比 G²）"
  what: |
    観察された差が「たまたま」で説明できるかどうかを表す数字です。
    大きいほど、偶然では説明しにくい差だということになります。
  high: |
    偶然では説明しにくい差です。
  low: |
    偶然の範囲で説明がつきます。
  caution: |
    ★ この数字だけで「重要な発見だ」と判断してはいけません。

    この数字には「データが大きいほど、ほとんど全ての語で大きくなる」
    という性質があります。100万語規模のデータを分析すると、
    実質的にはごくわずかな差しかない語でも、
    この数字は大きな値を示します。

    そのため、この数字は「差があるかどうか」を見るためだけに使い、
    「その差がどれくらい大きいか」は必ず log ratio で判断してください。
    両方を見て、初めて意味のある解釈ができます。
  range: |
    0以上。6.63以上でp<0.01、10.83以上でp<0.001に相当。

# -----------------------------------------------------------------------------
# 2群比較に関する指標
# -----------------------------------------------------------------------------

p_value:
  label: "偶然でそうなる確率（p値）"
  what: |
    「実際には差がないのに、たまたまこれくらいの差が出てしまう確率」です。
    小さいほど、偶然とは考えにくいということになります。
  high: |
    偶然でも起こりうる差です。
  low: |
    偶然では起こりにくい差です。
  caution: |
    ★ 大きなデータでは、ほとんど全ての語でp値が小さくなります。
      この数字だけで判断してはいけません。

    p値が答えているのは「差があるかどうか」だけで、
    「その差がどれくらい大きいか」には一切答えていません。
    ごくわずかな差でも、データが大きければp値は小さくなります。

    また、よくある誤解として「p値が小さい = 重要な発見」がありますが、
    これは正しくありません。必ず log ratio と合わせて見てください。

    なお「p < 0.05 なら有意」という基準は慣習であって、
    自然界の法則ではありません。0.049 と 0.051 の間に
    本質的な違いはないことも覚えておいてください。
  range: |
    0.0 〜 1.0。慣習的に 0.05 未満を「有意」とすることが多い。

log_ratio:
  label: "差の大きさ（log ratio）"
  what: |
    2つのグループの間で、その語の使われ方が何倍違うかを表す数字です。
    +1 で2倍、+2 で4倍、+3 で8倍を意味します。
    マイナスなら、もう一方のグループのほうが多いということです。
  high: |
    ★ 2つのグループの間で、実質的に大きな差があります。
  low: |
    差はあっても、ごくわずかです。
  caution: |
    ★ 2群比較で本当に見るべきなのは、p値ではなくこの数字です。

    p値は「差があるか」しか教えてくれませんが、
    この数字は「どれくらい違うか」を教えてくれます。
    論文で報告すべきなのは、こちらです。

    目安として、絶対値が1未満（2倍未満）の差は、
    たとえp値が小さくても、実質的な発見として扱わないほうが安全です。

    また、片方のグループで出現回数が0だと計算できないため、
    補正した値が使われます。
    その場合は結果にその旨が表示されるので、扱いに注意してください。
  range: |
    0が「差なし」。+1 = 2倍、+2 = 4倍、+3 = 8倍。
    絶対値1以上を実質的な差の目安とする。
  example: |
    log ratio = +3.2 → 「一方のグループで約9倍多く使われている」

odds_ratio:
  label: "差の大きさ・別表現（オッズ比）"
  what: |
    log ratio と同じことを、別の形で表した数字です。
    1が「差なし」で、2なら「2倍出やすい」という読み方をします。
  high: |
    一方のグループで多く使われています。
  low: |
    1より小さければ、もう一方のグループで多く使われています。
  caution: |
    log ratio と同じ内容を表しているので、どちらか片方を報告すれば十分です。
    分野によって使われる指標が違うので、
    指導教員や投稿先の慣習に合わせて選んでください。

    こちらも、片方の出現回数が0だと計算できません。
  range: |
    0より大きい。1が「差なし」。

# -----------------------------------------------------------------------------
# 多変量解析に関する指標
# -----------------------------------------------------------------------------

correspondence_axis:
  label: "対応分析の軸（第1軸・第2軸）"
  what: |
    たくさんのグループと語の関係を、2次元の図の上に配置し直したものです。
    図の上で近くにあるものほど、関係が強いという読み方をします。
  high: |
    軸の端に位置するものほど、その軸が表す特徴を強く持っています。
  caution: |
    ★ 軸そのものには、あらかじめ決まった意味はありません。

    「第1軸は書き言葉と話し言葉の違いを表している」といった解釈は、
    分析結果が教えてくれるものではなく、
    図を見た研究者が自分で考えて名付けるものです。
    ソフトが自動で意味を教えてくれると思わないでください。

    また、図の上で近くにあることは「関係がある」を示唆するだけで、
    「原因と結果」を示すものではありません。

    軸が説明している情報の割合（寄与率）が低いときは、
    その図はデータの一部しか表していません。
    寄与率が合計50%を下回る場合、図の解釈には慎重になってください。
  range: |
    軸ごとの寄与率は%で表示される。合計が大きいほど図の信頼性が高い。

network_centrality:
  label: "共起ネットワークの中心性"
  what: |
    語と語のつながりを線で結んだ図の中で、
    その語がどれくらい中心的な位置にあるかを表す数字です。
  high: |
    多くの語とつながっている、ハブのような語です。
  low: |
    つながりが少ない、周辺的な語です。
  caution: |
    ★ 中心にあること = 重要であること、ではありません。

    機能語や、意味の広い語（「こと」「もの」「する」など）は、
    単にどんな語ともつながりやすいという理由で中心に来ます。
    それは内容的な重要さとは別の話です。

    また、この図は「どの語を分析に含めるか」「線を引く基準をどこに置くか」
    という設定次第で、見た目が大きく変わります。
    論文に載せるときは、必ず設定値を明記してください。
    設定を書かない図は、他の研究者が再現できません。
  range: |
    指標により異なる（次数中心性・媒介中心性など）。相対的な比較に使う。

# -----------------------------------------------------------------------------
# 言語処理に関する用語（分析指標ではないが、利用者が必ず出会う用語）
# -----------------------------------------------------------------------------

token_type:
  label: "延べ語数（token）と 異なり語数（type）"
  what: |
    延べ語数は、語を1つずつ全部数えた総数です。
    異なり語数は、語の「種類」がいくつあったかです。
    「あ、あ、い」なら、延べ語数3、異なり語数2になります。
  caution: |
    論文では両方を報告するのが慣習です。
    どちらか一方だけでは、データの規模が正しく伝わりません。

lemma:
  label: "見出し語（lemma）"
  what: |
    活用や変化した形を、辞書に載っている代表の形にまとめたものです。
    「行った」「行きます」「行かない」は、すべて「行く」にまとめられます。
  caution: |
    ★ まとめるかどうかで、結果が大きく変わります。

    活用形の違い自体を研究したい場合は、まとめてはいけません。
    設定でOFFにしてから分析してください。

    また、自動でまとめる処理は完璧ではありません。
    特にドイツ語では、手法によって結果が異なることがあります。
    重要な語については、実際にどうまとめられたかを確認してください。

lemma_key:
  label: "集計キーと表示名（同形異義語の区別）"
  what: |
    画面に出る「語」は見やすいように短い表示名です。
    実際の集計は「集計キー」で行っています。
    日本語の辞書（UniDic）は、同じ形でも意味が違う語を
    「ライト-light（光）」「ライト-light（軽い）」のように区別しているため、
    集計キーにはこの区別が含まれ、表示名では「ライト」とだけ出ます。
  caution: |
    ★ 表示名が同じ行が2つ以上あるときは、別の語として数えられています。

    「ライト」が2行に分かれているのは間違いではなく、
    「光のライト」と「軽いというライト」を区別して数えた結果です。
    どちらがどの意味かは「集計キーを表示」を ON にして確認してください。

    まとめて数えたい場合は、CSV に書き出してから表計算ソフトで合算してください。
    ツール側で勝手にまとめることはしません。まとめると、
    「はし（橋）」と「はし（箸）」のような語の区別が失われ、
    利用者がそれに気づけなくなるためです。

    なお、辞書による意味の区別は文脈からの自動推定なので、
    完璧ではありません。重要な語は用例（KWIC）で確認してください。

function_words:
  label: "機能語（助詞・冠詞・前置詞など）"
  what: |
    それ自体では具体的な意味を持たず、
    文法的な働きをする語のことです。
    日本語の「が」「を」「の」、ドイツ語の "die" "und"、
    英語の "the" "of" などがこれにあたります。
  caution: |
    既定の設定では、これらは分析から除外されています。
    内容に関する分析では、除外したほうが結果が見やすくなるためです。

    ただし、文体研究や文法研究では、
    ★ 機能語こそが分析の対象になります。
    その場合は必ず設定でONにしてください。
    OFFのまま分析すると、調べたいものが最初から消えています。

short_long_unit:
  label: "短単位と長単位（日本語）"
  what: |
    日本語の語の区切り方には2つの基準があります。
    「短単位」は最小の単位で、「東京都」は「東京」「都」の2語、
    「食べている」は「食べ」「て」「いる」の3語になります。
    「長単位」はひとまとまりの意味で区切り、「東京都」で1語、
    「食べている」で1語と数えます。
  caution: |
    このツールは短単位（UniDic）で数えます。長単位には対応していません。

    そのため、複合語（「国際会議」「環境問題」）や複合動詞（「食べ終わる」）は
    複数の語に分かれて数えられます。
    「東京」の出現回数には「東京都」「東京駅」の中の「東京」も含まれます。

    論文には必ず「UniDic 短単位で集計」と明記してください。
    書かないと、長単位で数えた他の研究と数字を比べられません。

compound_splitting:
  label: "複合語の分割（ドイツ語）"
  what: |
    ドイツ語は名詞をいくつもつなげて1語にします。
    Autobahnraststätte（高速道路のサービスエリア）は
    Autobahn + Raststätte に分けられます。
  caution: |
    分割しないと、連結された語がすべて別々の語として数えられ、
    出現回数1回の語ばかりになって、統計が機能しなくなります。

    一方で、分割すると「どんな複合語が作られているか」という
    造語の研究ができなくなります。

    どちらが正しいかは研究目的によって決まります。
    ★ このツールは両方の集計を別々に表示するので、
      目的に合うほうを選んでください。

separable_verbs:
  label: "分離動詞（ドイツ語）"
  what: |
    anrufen（電話する）のような動詞は、
    文の中では "Ich rufe dich an." のように、
    前の部分（an）が文の末尾に離れて置かれます。
  caution: |
    そのまま数えると、rufen と an が別々の語として集計され、
    anrufen という語の出現回数が0になってしまいます。

    このツールは既定でこれを元の形に戻しますが、
    離れた形そのものを研究したい場合は、設定でOFFにしてください。
