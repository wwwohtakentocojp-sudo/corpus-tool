[project]
name = "corpus-tool"
version = "0.0.1"
description = "統計リテラシー不要のコーパス分析ツール（言語学者向け）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    # 図は plotly。PNG 書き出しは plotly のカメラアイコン（ブラウザ側）に任せ、
    # サーバー側の画像生成は持たない（表示と書き出しの二重実装を避ける）
    "plotly>=5.24",
    "chardet>=5.2",
    # 日本語形態素解析
    "fugashi>=1.4",
    "unidic-lite>=1.0.8",
    # 英語・ドイツ語（spaCy + 小モデル。大モデルは extra "large-models"）
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    # ドイツ語固有: 見出し語化の比較用タガー、複合語分割
    "HanTa>=1.1",
    "compound-split>=1.0",
    # CSV / Excel 読み込み
    "openpyxl>=3.1",
    # PDF（論文など）の文字取り出し
    "pypdf>=5.0",
    # 共起ネットワーク
    "networkx>=3.2",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
# 精度重視の大モデル（1言語あたり数百MB）: uv sync --extra large-models
large-models = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "de-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
]
# 日本語の係り受け（Phase 2 の係り受けコロケーション用。任意）
ginza = [
    "ginza>=5.2",
    "ja-ginza>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
